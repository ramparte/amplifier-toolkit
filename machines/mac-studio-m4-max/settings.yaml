bundle:
  active: my-amplifier
  added:
    my-amplifier: /Users/sam/ANext/my-amplifier/bundle.md
config:
  providers:
  # Primary: Ollama (multi-model routing matrix)
  - config:
      auto_pull: "false"
      default_model: qwen3.5:35b
      enable_thinking: "true"
      host: http://localhost:11434
      num_ctx: "65536"
      priority: 1
      timeout: "600"
    module: provider-ollama
    source: git+https://github.com/microsoft/amplifier-module-provider-ollama@main
  # Secondary: oMLX (fast MLX inference, SSD KV cache)
  # Accessed via fast-local agent's provider_preferences
  - config:
      base_url: http://localhost:8000/v1
      api_key: not-needed
      default_model: gemma-4-31b-it-4bit
      priority: 2
      timeout: "600"
    module: provider-openai
    source: git+https://github.com/microsoft/amplifier-module-provider-openai@main
overrides:
  hooks-session-naming:
    config:
      provider_timeout: 60
routing:
  matrix: balanced
  overrides:
    general:
      - provider: ollama
        model: qwen3.5:35b
    fast:
      - provider: ollama
        model: gemma4:e4b
    coding:
      - provider: ollama
        model: qwen3-coder:30b
    ui-coding:
      - provider: ollama
        model: qwen3-coder:30b
    reasoning:
      - provider: ollama
        model: deepseek-r1:70b
        config:
          reasoning_effort: high
    critique:
      - provider: ollama
        model: qwen3.5:35b
    creative:
      - provider: ollama
        model: gemma4:31b
    writing:
      - provider: ollama
        model: gemma4:31b
    research:
      - provider: ollama
        model: qwen3.5:35b
    vision:
      - provider: ollama
        model: qwen3-vl:32b
    security-audit:
      - provider: ollama
        model: qwen3.5:35b
    critical-ops:
      - provider: ollama
        model: qwen3.5:35b
updates:
  auto_prompt: true
  check_frequency_hours: 24
